<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Top arc for Nepali text -->
    <path id="rss-top-arc" d="M 45,160 A 115,115 0 1,1 275,160" fill="none"/>
    <!-- Bottom arc for English text -->
    <path id="rss-bottom-arc" d="M 265,160 A 105,105 0 0,1 55,160" fill="none"/>
  </defs>

  <!-- Outer Dark Blue Crescent -->
  <path d="M 160 15 A 145 145 0 0 1 300 180 A 140 140 0 0 0 160 35 A 140 140 0 0 0 20 180 A 145 145 0 0 1 160 15 Z" fill="#1b2a6b"/>

  <!-- Inner Red Crescent -->
  <path d="M 30 180 A 130 130 0 0 0 290 180 A 142 142 0 0 1 160 298 A 142 142 0 0 1 30 180 Z" fill="#e52328"/>

  <!-- Globe / Blue Circle -->
  <circle cx="160" cy="155" r="95" fill="#58c6fc"/>

  <!-- Map / Continents silhouette in Navy -->
  <path d="M 105 90 Q 140 80 180 85 Q 220 95 240 130 Q 230 170 210 195 Q 180 175 160 170 Q 130 165 110 130 Z" fill="#1a6cb8" opacity="0.9"/>
  <path d="M 90 130 Q 120 140 140 180 Q 120 220 100 210 Q 80 180 90 130 Z" fill="#14589c"/>

  <!-- Microphone Graphic in center -->
  <g transform="translate(162, 120)">
    <!-- Mic Body / Grille -->
    <rect x="0" y="0" width="36" height="52" rx="18" fill="#ffffff" stroke="#1b2a6b" stroke-width="2.5"/>
    <!-- Grille lines -->
    <line x1="6" y1="12" x2="30" y2="12" stroke="#1b2a6b" stroke-width="2"/>
    <line x1="4" y1="18" x2="32" y2="18" stroke="#1b2a6b" stroke-width="2"/>
    <line x1="4" y1="24" x2="32" y2="24" stroke="#1b2a6b" stroke-width="2"/>
    <line x1="4" y1="30" x2="32" y2="30" stroke="#1b2a6b" stroke-width="2"/>
    <line x1="6" y1="36" x2="30" y2="36" stroke="#1b2a6b" stroke-width="2"/>
    <line x1="10" y1="42" x2="26" y2="42" stroke="#1b2a6b" stroke-width="2"/>
    <!-- Mic Base -->
    <path d="M 12 53 L 24 53 L 22 68 L 14 68 Z" fill="#ffffff" stroke="#1b2a6b" stroke-width="2"/>
  </g>

  <!-- Top Text: रेडियो श्वेत शार्दूल ९३.६ मेगाहर्ज -->
  <text font-family="'Mukti', 'Kantipur', sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff">
    <textPath href="#rss-top-arc" startOffset="50%" text-anchor="middle">
      रेडियो श्वेत शार्दूल ९३.६ मेगाहर्ज
    </textPath>
  </text>

  <!-- Bottom Text: Radio Shweta Shardul 93.6 MHz -->
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="900" fill="#ffffff">
    <textPath href="#rss-bottom-arc" startOffset="50%" text-anchor="middle">
      Radio Shweta Shardul 93.6 MHz
    </textPath>
  </text>

  <!-- Subtitle: स्थापना : २०६६ -->
  <text x="160" y="308" font-family="'Mukti', 'Kantipur', sans-serif" font-size="13" font-weight="900" fill="#1b2a6b" text-anchor="middle">स्थापना : २०६६</text>
</svg>
