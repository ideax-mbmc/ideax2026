<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 175" width="100%" height="100%">
  <!-- Top badge -->
  <circle cx="180" cy="32" r="22" fill="#0044ff"/>
  <text x="174" y="40" font-family="'Brush Script MT', 'Dancing Script', Georgia, cursive, serif" font-size="26" font-style="italic" fill="#ffffff" font-weight="bold">R</text>
  <line x1="184" y1="22" x2="197" y2="15" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="184" y1="29" x2="200" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="184" y1="36" x2="200" y2="26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- "R O Y A L" text -->
  <g transform="translate(180, 95)">
    <!-- R -->
    <text x="-130" y="0" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#ffffff">R</text>
    <!-- O as Blue Circle with stripes -->
    <circle cx="-50" cy="-16" r="28" fill="#0044ff"/>
    <line x1="-65" y1="-7" x2="-45" y2="-27" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-54" y1="2" x2="-28" y2="-24" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <line x1="-40" y1="11" x2="-16" y2="-13" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <!-- Y A L -->
    <text x="-8" y="0" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#ffffff">YAL</text>
    <text x="96" y="-28" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">TM</text>
  </g>

  <!-- SHOES -->
  <text x="180" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="14px" text-anchor="middle" fill="#ffffff">SHOES</text>

  <!-- नामै काफी छ -->
  <text x="180" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#38bdf8">नामै काफी छ</text>
</svg>
